<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | MIT Socials</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                🎓 MIT SOCIALS
            </a>
            <div style="display: flex; align-items: center; gap: 15px;">
                <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
                    🌙 Dark
                </button>
            </div>
        </div>
    </header>

    <!-- Auth Main Section -->
    <div class="auth-wrapper" style="padding: 3rem 1rem;">
        <div class="auth-card" style="max-width: 620px;">
            <div class="auth-header">
                <h1>Join MIT Socials 🎓</h1>
                <p>Register your student profile to connect with your campus community</p>
            </div>

            <!-- Dynamic Alert Box -->
            <div id="alert-box" class="alert"></div>

            <!-- Registration Form -->
            <form id="register-form">
                
                <div class="form-group">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" id="full_name" name="full_name" class="form-input" 
                           placeholder="e.g. Alex Rivera" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="college_email" class="form-label">College Email</label>
                        <input type="email" id="college_email" name="college_email" class="form-input" 
                               placeholder="alex.mit@mit.edu" required>
                    </div>

                    <div class="form-group">
                        <label for="student_id" class="form-label">Student ID (PRN / Roll No)</label>
                        <input type="text" id="student_id" name="student_id" class="form-input" 
                               placeholder="e.g. MIT2024CS001" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="branch" class="form-label">Branch / Department</label>
                        <select id="branch" name="branch" class="form-select" required>
                            <option value="" disabled selected>Select Branch</option>
                            <option value="Computer Engineering">Computer Engineering</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="AI & Data Science">AI & Data Science</option>
                            <option value="Electronics & Telecom">Electronics & Telecom</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                            <option value="Civil Engineering">Civil Engineering</option>
                            <option value="Chemical Engineering">Chemical Engineering</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="year" class="form-label">Academic Year</label>
                        <select id="year" name="year" class="form-select" required>
                            <option value="" disabled selected>Select Year</option>
                            <option value="First Year">First Year (FE)</option>
                            <option value="Second Year">Second Year (SE)</option>
                            <option value="Third Year">Third Year (TE)</option>
                            <option value="Final Year">Final Year (BE)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="division" class="form-label">Division</label>
                    <select id="division" name="division" class="form-select" required>
                        <option value="" disabled selected>Select Division</option>
                        <option value="A">Division A</option>
                        <option value="B">Division B</option>
                        <option value="C">Division C</option>
                        <option value="D">Division D</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="password-field-wrapper">
                            <input type="password" id="password" name="password" class="form-input" 
                                   placeholder="••••••••" required autocomplete="new-password">
                            <button type="button" class="password-toggle-btn">Show</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <div class="password-field-wrapper">
                            <input type="password" id="confirm_password" name="confirm_password" class="form-input" 
                                   placeholder="••••••••" required autocomplete="new-password">
                            <button type="button" class="password-toggle-btn">Show</button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">
                    Complete Registration
                </button>
            </form>

            <div class="auth-footer-links">
                Already registered? <a href="login.html">Sign in here</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 MIT Socials. Core Java + Servlets + JDBC + MySQL Platform.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
